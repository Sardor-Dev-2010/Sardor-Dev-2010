<svg width="100%" height="250" viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <style>
      .title { font: 700 64px 'Segoe UI', Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .subtitle { font: 400 28px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; text-anchor: middle; }
      .wave {
        animation: wave 10s infinite linear;
        transform-origin: center bottom;
      }
      @keyframes wave {
        0% { transform: scaleY(1); }
        50% { transform: scaleY(1.1); }
        100% { transform: scaleY(1); }
      }
      .typewriter {
        font: 600 24px 'Fira Code', monospace;
        fill: #60A5FA;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="100%" height="250" fill="url(#bg)" rx="15" />
  
  <path class="wave" d="M 0 250 L 0 200 Q 300 150 600 200 T 1200 200 L 1200 250 Z" fill="#050B14" opacity="0.8"/>
  <path class="wave" d="M 0 250 L 0 220 Q 300 180 600 220 T 1200 180 L 1200 250 Z" fill="#07111F" style="animation-delay: -5s;"/>

  <text x="600" y="110" class="title">ELMURODOV SARDOR</text>
  <text x="600" y="160" class="subtitle">Full-Stack &amp; Mobile Developer</text>
  <text x="600" y="210" class="typewriter">DESIGN. BUILD. SHIP.</text>

</svg>
