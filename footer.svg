<svg width="100%" height="130" viewBox="0 0 1200 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0B1B33" />
      <stop offset="100%" stop-color="#07111F" />
    </linearGradient>
    <style>
      .wave {
        animation: wave 10s infinite linear;
        transform-origin: center top;
      }
      @keyframes wave {
        0% { transform: scaleY(1); }
        50% { transform: scaleY(1.1); }
        100% { transform: scaleY(1); }
      }
      .particle { animation: float 6s ease-in-out infinite; }
      @keyframes float {
        0% { transform: translateY(0); opacity: 0.15; }
        50% { transform: translateY(10px); opacity: 0.6; }
        100% { transform: translateY(0); opacity: 0.15; }
      }
      .sign { font: 500 15px 'Consolas', monospace; fill: #93C5FD; text-anchor: middle; opacity: 0.75; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="100%" height="130" fill="url(#bg)" rx="15" />

  <!-- floating particles -->
  <circle class="particle" cx="150" cy="90" r="2.5" fill="#93C5FD" />
  <circle class="particle" cx="320" cy="105" r="2" fill="#FFFFFF" style="animation-delay:-2s" />
  <circle class="particle" cx="900" cy="95" r="2.5" fill="#93C5FD" style="animation-delay:-3.5s" />
  <circle class="particle" cx="1060" cy="80" r="2" fill="#FFFFFF" style="animation-delay:-5s" />

  <path class="wave" d="M 0 0 L 0 50 Q 300 100 600 50 T 1200 50 L 1200 0 Z" fill="#050B14" opacity="0.8"/>
  <path class="wave" d="M 0 0 L 0 70 Q 300 30 600 70 T 1200 30 L 1200 0 Z" fill="#07111F" style="animation-delay: -5s;"/>

  <text x="600" y="112" class="sign">designed &amp; built by Sardor · 2026</text>

</svg>
