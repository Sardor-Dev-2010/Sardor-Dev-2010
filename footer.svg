<svg width="100%" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#07111F" />
    </linearGradient>
    <style>
      .wave {
        animation: wave 10s infinite linear;
        transform-origin: center top;
      }
      @keyframes wave {
        0% { transform: scaleY(1); }
        50% { transform: scaleY(1.1); }
        100% { transform: scaleY(1); }
      }
    </style>
  </defs>

  <rect width="100%" height="120" fill="url(#bg)" rx="15" />
  
  <path class="wave" d="M 0 0 L 0 50 Q 300 100 600 50 T 1200 50 L 1200 0 Z" fill="#050B14" opacity="0.8"/>
  <path class="wave" d="M 0 0 L 0 70 Q 300 30 600 70 T 1200 30 L 1200 0 Z" fill="#07111F" style="animation-delay: -5s;"/>

</svg>
