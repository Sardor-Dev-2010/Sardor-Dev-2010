<svg width="100%" height="8" viewBox="0 0 1200 8" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0" />
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="1" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
    <style>
      .base { fill: #1E293B; opacity: 0.55; }
      .shine { animation: sweep 5s linear infinite; }
      @keyframes sweep {
        0% { transform: translateX(-320px); }
        100% { transform: translateX(1200px); }
      }
    </style>
  </defs>
  <rect class="base" x="0" y="2" width="1200" height="4" rx="2" />
  <rect class="shine" x="0" y="2" width="320" height="4" rx="2" fill="url(#sweep)" />
</svg>
